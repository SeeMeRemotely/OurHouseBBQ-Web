<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our House BBQ Co. • Miss us yet?</title>
  <meta name="description" content="Our House BBQ Co. · Craft Barbecue, Grand Lake, Oklahoma. We've been cooking something up." />

  <meta property="og:title" content="Miss us yet? · Our House BBQ Co." />
  <meta property="og:description" content="We've been cooking something up. Stay tuned." />
  <meta property="og:image" content="https://ourhousebbq.com/ourhouse-logo.png" />
  <meta property="og:url" content="https://ourhousebbq.com/" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    :root{
      --bbq-gold:#f3b64a;
      --bbq-cream:#f5e1c4;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    /* Rolled-down shutter, the full "Miss us yet?" holding screen */
    body{
      min-height:100dvh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center;
      padding:24px 16px 120px;
      font-family:Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color:#fff;
      overflow-x:hidden;
      background:
        radial-gradient(900px 600px at 50% 35%, rgba(180,35,35,.22), transparent 65%),
        repeating-linear-gradient(180deg, #1e1413 0 30px, #0e0807 30px 32px, #2b1c19 32px 34px);
      background-color:#140d0c;
    }

    .logo{
      width:min(46%, 190px); margin-bottom:22px;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.8));
    }
    h1{
      font-family:Oswald, sans-serif; text-transform:uppercase;
      font-size:clamp(3rem, 14vw, 7rem); line-height:.95; letter-spacing:.04em;
      color:var(--bbq-cream); text-shadow:0 6px 30px rgba(0,0,0,.8);
    }
    h1 em{ font-style:normal; color:var(--bbq-gold); }
    .tease{
      margin-top:16px; font-size:clamp(1rem, 3.6vw, 1.25rem); font-style:italic;
      color:rgba(255,255,255,.78);
    }
    .stencil{
      margin-top:26px; font-family:Oswald, sans-serif; text-transform:uppercase;
      letter-spacing:.3em; font-size:.75rem; color:rgba(243,182,74,.55);
      border:1px dashed rgba(243,182,74,.35); padding:6px 14px; border-radius:4px;
    }

    /* bottom rail + handle */
    .rail{
      position:fixed; left:0; right:0; bottom:0; height:96px;
      background:linear-gradient(180deg, #3a2622, #1a100e);
      border-top:3px solid var(--bbq-gold);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    }
    .handle{
      width:120px; height:14px; border-radius:7px;
      background:linear-gradient(180deg, #f6c766, #c98d24);
      box-shadow:0 4px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5);
    }
    .hint{
      font-family:Oswald, sans-serif; text-transform:uppercase; letter-spacing:.22em;
      font-size:.78rem; color:var(--bbq-cream);
    }
  </style>
</head>
<body>
  <img class="logo" src="ourhouse-logo.png" alt="Our House BBQ Co. logo">
  <h1>Miss us<br><em>yet?</em></h1>
  <p class="tease">We've been cooking something up.</p>
  <div class="stencil">Our House BBQ Co. · Grand Lake</div>

  <div class="rail" aria-hidden="true">
    <div class="handle"></div>
    <div class="hint">Stay tuned</div>
  </div>
</body>
</html>
